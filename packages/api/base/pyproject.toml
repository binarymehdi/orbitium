[project]
name = "api"
version = "0.1.0"
description = "orbitiun backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.3",
    "psycopg[binary]>=3.2.11",
    "pydantic-settings>=2.11.0",
    "sqlmodel>=0.0.27",
]

[tool.uv.workspace]
members = [
    "orbitium",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
]
