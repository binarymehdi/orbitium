services:
  db:
    image: postgres:17-alpine
    container_name: orbitium-db
    env_file:
      - ./packages/api/base/.env
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db:
